[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "music-engine"
version = "0.1.0"
description = "A small CLI for organizing song downloads from an authorized source."
requires-python = ">=3.10"
dependencies = ["mutagen>=1.47"]

[project.scripts]
music-engine = "music_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
